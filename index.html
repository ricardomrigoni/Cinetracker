        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap');

        :root {

               MATINÊ — tema claro. Papel de cartaz antigo + tinta + vermelho
               de cortina de cinema. Nada de azul-Apple: aqui é sessão da tarde.

            --bg-body: #f2ead9;

            --bg-input: rgba(43, 30, 15, 0.06);

            --border: #ddcda5;

            --accent-hover: #7f1e22;
            --chart-bar: #a6272c;
            --gold: #b8912c;
            --gold-soft: rgba(184, 145, 44, 0.16);

            cursor: pointer; box-shadow: var(--card-shadow);
            transition: transform 0.15s ease, background 0.15s ease;
            animation: back-fab-in 0.25s cubic-bezier(0.25,0.8,0.25,1);
        }
        .back-fab:hover { background: var(--gold-soft); transform: translateY(-2px); }
        .back-fab-arrow { font-size: 1.05rem; line-height: 1; }
        @keyframes back-fab-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 700px) { .back-fab { left: 16px; bottom: 16px; padding: 10px 16px 10px 14px; } }

        .toast {
            display: flex; align-items: flex-start; gap: 10px;
            background: var(--bg-panel); color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 14px 16px;
            box-shadow: var(--card-shadow);
            font-size: 0.85rem; font-weight: 600; line-height: 1.4;
            animation: toast-in 0.25s cubic-bezier(0.25,0.8,0.25,1);
            border-left: 4px solid var(--gold);
        }
        .toast.toast-error { border-left-color: var(--score-low); }
        .toast.toast-success { border-left-color: var(--score-high); }
        .toast.toast-info { border-left-color: var(--gold); }
        .toast-icon { font-size: 1.05rem; line-height: 1.3; flex-shrink: 0; }
        .toast-close { margin-left: auto; cursor: pointer; color: var(--text-muted); font-weight: 700; flex-shrink: 0; padding-left: 6px; }
        .toast.toast-out { animation: toast-out 0.2s ease forwards; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateX(20px); } }

        /* --- Modal de confirmação genérico --- */
        .confirm-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(10, 7, 3, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            justify-content: center; align-items: center; padding: 20px;
        }
        .confirm-overlay.open { display: flex; }

        // Lista "dumbbell" (dois pontos conectados numa régua 0–10) — usada na
        // Maior Divergência de Opinião
        function buildDumbbellList(items) {
            if (!items.length || items[0].diff <= 0) return '<div class="empty-hint">Sem divergências ainda.</div>';
            return items.map((m, idx) => {
                const pIsr = (m.scIsr / 10) * 100;
                const pRic = (m.scRic / 10) * 100;
                const left = Math.min(pIsr, pRic);
                const right = Math.max(pIsr, pRic);
                return `
                    <div class="dumbbell-item" title="${escapeHtml(m.title)}">
                        <div class="dumbbell-top">
                            <span class="rank-item-name">${idx+1}. ${escapeHtml(m.title)}</span>
                            <span class="rank-item-value">Δ ${m.diff.toFixed(1)}</span>
                        </div>
                        <div class="dumbbell-track">
                const importedMovies = [];
                let mode = 'movies'; // 'movies' | 'pending'
                let importedPending = null; // só substitui a watchlist atual se a seção existir no arquivo
                let skippedLines = 0; // linhas com formato inesperado, ignoradas silenciosamente

                // Detecta o separador de campos: novo padrão é ";", mas arquivos exportados
                // antes dessa mudança ainda usam TAB — assim ambos continuam funcionando.
                const delimiter = (lines[0] || '').includes('\t') ? '\t' : ';';
                
                // Ignora cabeçalho (i=1)
                for (let i = 1; i < lines.length; i++) {
                    const rawLine = lines[i];
                    const line = rawLine.trim();

                    // Detecta o início da seção da watchlist "Sortear Filme"
                    if (line === '[SORTEAR]') {
                        mode = 'pending';
                        importedPending = [];
                        continue;
                    }

                    if (mode === 'pending') {
                        if (!line || line.startsWith('Título')) continue; // linha vazia ou cabeçalho da seção
                        const c = rawLine.split(delimiter);
                        const pTitle = (c[0] || '').trim();
                        if (!pTitle) continue;
                        importedPending.push({ id: importedPending.length + 1, title: pTitle, by: (c[1] || 'Ambos').trim() });
                        continue;
                    }

                    if (!line) continue;
                    
                    const c = line.split(delimiter);
                    if (c.length < 10) { skippedLines++; continue; }

                        </div>
                    `;
                    return;
                }

                if (!this.filtered.length) {
                    grid.innerHTML = `
                        <div class="catalog-empty-state">
                            <div class="catalog-empty-icon">🔍</div>
                            <div class="catalog-empty-title">Nenhum filme encontrado</div>
                            <div class="catalog-empty-text">Nenhum filme corresponde aos filtros ou à busca atual. Tente ajustar o período, o diretor, o gênero ou o termo pesquisado.</div>

                    `;
                    return;

                // O selo de ranking e a nota exibida acompanham o critério de ordenação escolhido
                const rankKey = { avg: 'rankAvg', isr: 'rankIsr', ric: 'rankRic' }[this.sortBy] || 'rankAvg';
                const scoreFn = { avg: m => m.avg, isr: m => m.scIsr, ric: m => m.scRic }[this.sortBy] || (m => m.avg);

                // Monta tudo em um array e insere de uma vez só (mais rápido que
                // concatenar innerHTML dentro do loop, principalmente em catálogos grandes).
                grid.innerHTML = this.filtered.map(m => {
                    const safeTitle = escapeHtml(m.title);
                    const img = m.poster || `https://via.placeholder.com/300x450/2b2013/e0a93b?text=${encodeURIComponent(m.title || 'Sem+Capa')}`;
                    const score = scoreFn(m);
                    const mainGenre = (m.genres || '').split(',')[0].trim();
                    // Só mostra o "esqueleto" pulsando enquanto ainda faz sentido esperar uma
                    // capa (a busca automática ainda não desistiu dessa); depois de falhar,
                    // a nova tentativa passa a ser manual, então a imagem fica estática.
                    const stillLoading = !m.poster && !m.posterFailed;
                    const directorTxt = (m.director || '').trim();
                    return `
                        <div class="movie-card" onclick="app.openModal(${m.id})" title="${safeTitle}">
                            <div class="rank-badge">#${m[rankKey]}</div>
                const diffCount = prevCount > 0 ? total - prevCount : null;

                return {
                    year, total, avgNossa, avgIsr, avgRic, mins,
                    topGenre, topDirector, bestMovie,
                    topMonth: monthNames[topMonthIdx], topMonthCount: monthCount[topMonthIdx],
                    diffCount
                };

            openRecap() {
                const years = [...new Set(this.movies.map(m => (m.date || '').split('-')[0]))].filter(Boolean).sort().reverse();
                if (!years.length) {
                    showToast('Ainda não há filmes suficientes para gerar um recap.', 'info');
                    return;
                }
                const sel = document.getElementById('recapYearSelect');
                sel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');

        // acordo. Isso existe porque, no celular, o cabeçalho quebra em várias linhas
        // (fica mais alto que os 74px do layout desktop) — sem essa sincronização, o
        // menu de abas (que usa --header-h para saber onde "grudar") ficava
        // posicionado por baixo do cabeçalho de verdade, escondido/sobreposto.
        // Usa ResizeObserver em vez de só "load"/"resize" porque a altura do
        // cabeçalho também muda depois (fonte carregando, botão Sair aparecendo
        // após o login) e um observer pega qualquer uma dessas mudanças sozinho.
        function syncHeaderHeight() {
            const header = document.querySelector('header');
            if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
        }
        const headerElForObserver = document.querySelector('header');
        if (window.ResizeObserver && headerElForObserver) {
            new ResizeObserver(syncHeaderHeight).observe(headerElForObserver);
        } else {
            window.addEventListener('load', syncHeaderHeight);
            window.addEventListener('resize', syncHeaderHeight);
        }
        syncHeaderHeight(); // roda já na primeira renderização, não só depois do "load"

        const app = new CineApp();
        cloud.init(); // busca sessão salva e, se houver, carrega os dados da nuvem

        // Fechar com ESC
        window.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            const recapOverlay = document.getElementById('recapOverlay');
            if (recapOverlay && recapOverlay.classList.contains('open')) { app.closeRecap(); return; }
            app.closeModal();
        });
